<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#060108" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0C0509"/>

  <!-- Glow blob -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)"/>

  <!-- Top-left accent bar -->
  <rect x="5" y="5" width="3" height="3" rx="1" fill="#E11D48" opacity="0.8"/>

  <!-- "25" text -->
  <text
    x="16" y="22"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="14"
    font-weight="800"
    text-anchor="middle"
    fill="url(#text-grad)"
    letter-spacing="-0.5"
  >25</text>

  <!-- Bottom-right accent dot -->
  <circle cx="25" cy="25" r="1.5" fill="#E11D48" opacity="0.6"/>
</svg>
